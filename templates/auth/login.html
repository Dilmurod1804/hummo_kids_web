{% extends 'base.html' %}

{% block title %}Tizimga Kirish — Humo Kids Kindergarten{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="glass-card" style="width: 100%; max-width: 440px; padding: 36px; border-radius: 28px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.15);">
        
        <!-- Header & Logo -->
        <div style="text-align: center; margin-bottom: 28px;">
            <div style="width: 60px; height: 60px; border-radius: 20px; background: var(--primary-gradient); margin: 0 auto 16px auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px var(--primary-glow);">
                <i data-lucide="sparkles" style="color: white; width: 30px; height: 30px;"></i>
            </div>
            <h2 style="font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 800; color: white; letter-spacing: -0.5px;">Humo Kids</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Smart Kindergarten Management System</p>
        </div>

        {% if error_message %}
        <div style="background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.4); color: #fb7185; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
            <i data-lucide="alert-circle" style="width: 18px; height: 18px;"></i>
            <span>{{ error_message }}</span>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Foydalanuvchi nomi</label>
                {{ form.username }}
            </div>
            <div class="form-group" style="margin-bottom: 24px;">
                <label class="form-label">Parol</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn-glass btn-primary" style="width: 100%; justify-content: center; padding: 14px; font-size: 15px; border-radius: 12px;">
                <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
                <span>Tizimga Kirish</span>
            </button>
        </form>

    </div>
</div>
{% endblock %}
